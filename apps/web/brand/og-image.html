<!doctype html>
<!-- Source of public/og.png, the link-preview image. Open at 1200 x 630 and screenshot it after changing. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Reenie+Beanie&family=IBM+Plex+Mono:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #e6e9ee; color: #1d2a73; font-family: "Unbounded", sans-serif; position: relative; overflow: hidden; }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(#1d2a7314 1px, transparent 1px); background-size: 6px 6px; }
  .copy { position: absolute; left: 80px; top: 86px; width: 640px; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #c8107a; margin: 0 0 26px; }
  h1 { font-weight: 900; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; text-transform: uppercase; margin: 0; text-shadow: 4px 4px 0 #ff3fa4; }
  .tape { position: absolute; right: 64px; top: 150px; width: 420px; transform: rotate(-6deg); filter: drop-shadow(14px 14px 0 #ff3fa4); }
  .url { position: absolute; left: 80px; bottom: 64px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 24px; letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="copy">
    <p class="eyebrow">Birthdays · weddings · farewells</p>
    <h1>Everyone picks a song. They get the mixtape.</h1>
  </div>
  <svg class="tape" viewBox="0 0 64 44" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0,-10)">
      <rect x="2" y="11" width="60" height="42" rx="5" fill="#1d2a73"/>
      <rect x="7" y="15" width="50" height="23" rx="3" fill="#f4f6f9"/>
      <text x="10" y="20.2" font-family="Reenie Beanie" font-size="5.4" fill="#1d2a73">years in rotation</text>
      <rect x="14" y="21.5" width="36" height="12" rx="6" fill="#1d2a73"/>
      <circle cx="22.5" cy="27.5" r="4.2" fill="#ff3fa4"/>
      <circle cx="41.5" cy="27.5" r="4.2" fill="#ff3fa4"/>
      <circle cx="22.5" cy="27.5" r="1.6" fill="#1d2a73"/>
      <circle cx="41.5" cy="27.5" r="1.6" fill="#1d2a73"/>
      <path d="M15 53 L19.5 43 H44.5 L49 53 Z" fill="#f4f6f9"/>
      <circle cx="25" cy="48.5" r="1.8" fill="#1d2a73"/>
      <circle cx="39" cy="48.5" r="1.8" fill="#1d2a73"/>
      <circle cx="5.5" cy="14.5" r="1" fill="#f4f6f9" opacity=".5"/>
      <circle cx="58.5" cy="14.5" r="1" fill="#f4f6f9" opacity=".5"/>
      <circle cx="5.5" cy="49.5" r="1" fill="#f4f6f9" opacity=".5"/>
      <circle cx="58.5" cy="49.5" r="1" fill="#f4f6f9" opacity=".5"/>
    </g>
  </svg>
  <div class="url">minutes.qfm.co.za</div>
</body>
</html>
