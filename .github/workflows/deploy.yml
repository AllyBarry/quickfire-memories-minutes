name: Deploy (Cloudflare Pages)

# Pull requests: typecheck, unit tests, web build, and the end-to-end suite against a local Pages dev server.
# Pushes to main (and manual runs): the same checks, then migrate D1, sync secrets and deploy the
# web app plus its Pages Functions (/api/*, /go/*) to the Cloudflare Pages project.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # never cancel a deploy halfway through a migration
  cancel-in-progress: false

env:
  PAGES_PROJECT: years-in-rotation

jobs:
  test:
    name: Typecheck, unit tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: API checks
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Web app typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build

  e2e:
    name: End-to-end against local Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install and prepare local D1
        working-directory: api
        run: |
          npm ci
          printf 'BETTER_AUTH_SECRET=%s\nCRON_SECRET=%s\nADMIN_DEV_EMAIL=staff@example.com\n' "$(openssl rand -base64 32)" "$(openssl rand -hex 24)" > .dev.vars
          npm run db:migrate:local

      - name: Start Pages locally
        working-directory: api
        run: |
          npx wrangler pages dev ../web/dist --port 8788 \
            --binding APP_URL=http://localhost:8788 --binding BETTER_AUTH_URL=http://localhost:8788 > pages.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8788/api/health && exit 0
            sleep 1
          done
          echo "Pages dev didn't start"; cat pages.log; exit 1

      - name: Run end-to-end checks
        working-directory: api
        run: python3 test/e2e_local.py

      - name: Pages log (on failure)
        if: failure()
        working-directory: api
        run: cat pages.log

  deploy:
    name: Deploy to production
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in GitHub settings to approve each deploy.
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://minutes.qfm.co.za' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://minutes.qfm.co.za' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Check required settings
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET CRON_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/DEPLOY.md)"; exit 1; fi

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install API
        working-directory: api
        run: npm ci

      - name: Check production config
        working-directory: api
        run: node scripts/check-prod-config.mjs

      # Migrations run before the new code goes live, so they must be additive (see docs/DEPLOY.md).
      - name: Apply D1 migrations
        working-directory: api
        run: npx wrangler d1 migrations apply yir --remote

      - name: Create the Pages project (first deploy only)
        working-directory: api
        run: |
          if npx wrangler pages project list 2>/dev/null | grep -qw "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists."
          else
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          fi

      # Secrets go in before the code, so the new Functions never start without them.
      - name: Sync secrets to Pages
        working-directory: api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          node -e '
            const out = {};
            for (const k of ["BETTER_AUTH_SECRET", "CRON_SECRET", "RESEND_API_KEY", "PAYSTACK_SECRET_KEY"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("secrets to sync:", Object.keys(out).join(", "));
          '
          npx wrangler pages secret bulk secrets.json --project-name "$PAGES_PROJECT"
          rm -f secrets.json

      - name: Deploy web app and Functions
        working-directory: api
        run: npx wrangler pages deploy ../web/dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -sf "$SITE_URL/api/health" | grep -q '"env":"production"'; then
              curl -sf -o /dev/null "$SITE_URL/" && echo "API and web app are up." && exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed after deploy. Roll back from the Pages project's Deployments tab (see docs/DEPLOY.md)."; exit 1
